name: Process approved submission (reusable)

# Reusable workflow that runs after a submission PR merges:
#   0. Verify the merge before treating it as an approval: the merger is an
#      authorised approver, the PR only touched generated files, and every
#      total recomputes from the entries + contract (scripts/verify_approval.py).
#      On refusal nothing below runs.
#   1. Stamp the submission YAML with approval metadata (status, approved_by,
#      approved_date) and re-render PDF + PNG (amber → green block).
#   2. Append the submission to ledger/<contract-id>.yml.
#   3. Commit the re-rendered files + ledger update back to main.
#   4. Edit the pinned ledger issue with the updated running totals.
#   5. Send the approval email to PSL (or admin only, if testing_mode=true)
#      with the approved PDF attached.
#   6. Record the email send in the submission YAML and commit it to main.
#   7. Post (or update) the audit comment on the original submission issue
#      confirming the merge, the ledger update, and the email send.
#   8. Apply the `processed` label to the closed PR.
#
# Re-run safe (issue #11). Every step skips work that is already done, so
# "Re-run failed jobs" is the recovery for a partial failure: the stamp keeps
# its original date, the ledger entry isn't appended twice, the email is sent
# at most once (its send is recorded on main), and the audit comment is
# edited in place. A PR already labelled `processed` is left alone unless
# `force_resend` is set. Contractor repos can also start this by hand
# (workflow_dispatch in the caller) for a run too old to re-run.
#
# Branch-protection note: this workflow pushes directly to main (step 3).
# That requires either no branch protection on main OR `github-actions[bot]`
# being on the "Allow specified actors to bypass required pull requests"
# list. For Phase 2 testing on contractor-engine-test (no protection), works
# as-is. For Phase 4 onboarding of real contractor repos (which DO enable
# branch protection per PLAN §11), the onboarding script will need to add
# github-actions[bot] to the bypass list — track this as a Phase 4 task.
#
# See PLAN.md §8 Phase 2.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      # The PR's body, merge commit and merger are read from the API in the
      # `resolve` job, so a manual dispatch with only a PR number takes the
      # same path as a merge. These three stay declared (and ignored) so
      # callers that still pass them keep validating.
      pr_body:
        required: false
        type: string
        default: ""
      merge_commit_sha:
        required: false
        type: string
        default: ""
      merged_by:
        required: false
        type: string
        default: ""
      force_resend:
        description: >
          Send the approval email even if an earlier run already sent it (and
          process a PR already labelled `processed`). For a deliberate resend.
        required: false
        type: boolean
        default: false

      engine_ref:
        description: >
          Which engine commit-ish to run the scripts from. MUST match the ref
          this workflow is called at in the caller's `uses:` line, or the
          pipeline definition and the code it drives come from different
          commits. Optional, defaulting to 'main': a caller that pins `@main`
          and omits this gets exactly the previous behaviour.
        required: false
        type: string
        default: "main"

    # The only secrets this pipeline uses (GITHUB_TOKEN is always available).
    # Callers pass these explicitly rather than `secrets: inherit`, so nothing
    # else in the org reaches the engine. Not `required`: a caller still on
    # `secrets: inherit` passes them anyway, and notify_email names any that
    # are missing. The two recipient addresses are secrets (not variables) so
    # the Actions log, which contractors can read, masks them.
    secrets:
      PSL_EMAIL:
        required: false
      QUANTECON_EMAIL_REVIEWER:
        required: false
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USER:
        required: false
      SMTP_PASSWORD:
        required: false
      SMTP_FROM:
        required: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      merged_by: ${{ steps.pr.outputs.merged_by }}
      issue_number: ${{ steps.pr.outputs.issue_number }}
      run: ${{ steps.pr.outputs.run }}
    steps:
      - name: Read the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FORCE_RESEND: ${{ inputs.force_resend }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" > /tmp/pr.json
          if [ "$(jq -r .merged /tmp/pr.json)" != "true" ]; then
            echo "ERROR: PR #${PR_NUMBER} is not merged; nothing to process." >&2
            exit 1
          fi
          if ! jq -e '.labels | map(.name) | index("submission")' /tmp/pr.json > /dev/null; then
            echo "ERROR: PR #${PR_NUMBER} has no \`submission\` label; not a submission PR." >&2
            exit 1
          fi
          echo "merge_sha=$(jq -r .merge_commit_sha /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "merged_by=$(jq -r .merged_by.login /tmp/pr.json)" >> "$GITHUB_OUTPUT"

          # PR body contains "Closes #N" per create_submission_pr.py
          ISSUE_NUMBER=$(jq -r '.body // ""' /tmp/pr.json \
            | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "WARN: No 'Closes #N' found in PR body; falling back to PR number $PR_NUMBER" >&2
            ISSUE_NUMBER="$PR_NUMBER"
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Original issue: #$ISSUE_NUMBER"

          # `processed` is applied only when every step succeeded, email
          # included, so there is nothing left to do (re-running a successful
          # run, or dispatching a finished PR) unless a resend is asked for.
          if jq -e '.labels | map(.name) | index("processed")' /tmp/pr.json > /dev/null \
             && [ "$FORCE_RESEND" != "true" ]; then
            {
              echo "PR #${PR_NUMBER} is already labelled \`processed\`: an earlier run"
              echo "completed every step, including the approval email. Nothing to do."
              echo "To send the approval email again, run with \`force_resend\`."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # One run per PR at a time: a merge-triggered run, a re-run and a manual
    # dispatch for the same PR queue rather than racing to send the email.
    concurrency:
      group: process-approved-pr-${{ inputs.pr_number }}
      cancel-in-progress: false

    steps:
      - name: Check out the contractor repo at main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need the merge commit's parent for diff-tree
          ref: main

      # Run the scripts from the same engine commit as this workflow file.
      #
      # `actions/checkout` with no `ref:` takes the engine's default branch, so
      # a caller pinned to `@some-branch` got that branch's workflow YAML
      # driving `main`'s scripts. The mismatch stays invisible until the YAML
      # passes a flag the scripts do not have.
      #
      # The ref has to come from the caller: there is no context value for it.
      # `github.job_workflow_ref` and `github.job_workflow_sha` both read as
      # EMPTY here (verified on real runs), and `github.workflow_ref` /
      # `github.workflow_sha` describe the *calling* workflow in the contractor
      # repo, not this one.
      - name: Check out the engine repo (scripts + templates)
        uses: actions/checkout@v4
        with:
          repository: QuantEcon/contractor-payments
          ref: ${{ inputs.engine_ref }}
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml==6.0.3

      - name: Install Typst
        run: |
          # Bump the version and the sha256 together (the tarball's, for this
          # version); tests/test_workflows.py checks every workflow agrees.
          TYPST_VERSION="0.13.0"
          TYPST_SHA256="cd1148da61d6844e62c330fc6222e988480acafe33b76daec8eb5d221258feb6"
          curl -fsSL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          # Refuse a tarball that isn't the one we pinned (bash -e stops here).
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJ -C /tmp -f /tmp/typst.tar.xz
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find the submission YAML in the merge commit
        id: find_submission
        env:
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
        run: |
          # The checkout is main at depth 2, so if another approval's
          # `[skip ci]` commit landed on main before this job started, the
          # merge commit's parent is outside that history and the diffs here
          # and in the verify step fail. Fetch the merge commit and its
          # parents explicitly; it's a no-op when they are already present.
          git fetch --no-tags --depth=2 origin "$MERGE_SHA"
          # Files added/changed by the merge — diff against the first parent
          # (i.e. main's HEAD before the merge). `git diff-tree` on a merge
          # commit is silent by default, hence the explicit parent compare.
          SUBMISSION_FILES=$(git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" \
            | grep -E '^submissions/.*\.yml$' || true)
          if [ -z "$SUBMISSION_FILES" ]; then
            echo "ERROR: No submissions/*.yml found in merge commit $MERGE_SHA" >&2
            echo "--- All files changed by the merge: ---" >&2
            git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" >&2 || true
            exit 1
          fi
          # Refuse to guess. A merge carrying more than one submission means
          # the branch accumulated an abandoned one (e.g. the period was
          # corrected before merge), and the previous `head -1` silently
          # approved whichever path sorted first — for a forward period
          # correction, the abandoned one. Fail loudly instead: nothing is
          # stamped, ledgered or emailed until an admin resolves it.
          SUBMISSION_COUNT=$(printf '%s\n' "$SUBMISSION_FILES" | wc -l | tr -d ' ')
          if [ "$SUBMISSION_COUNT" -gt 1 ]; then
            echo "ERROR: merge $MERGE_SHA carries $SUBMISSION_COUNT submission files;" >&2
            echo "refusing to guess which one was approved." >&2
            printf '%s\n' "$SUBMISSION_FILES" >&2
            echo "Fix: keep one submission per PR — revert the merge, drop the" >&2
            echo "abandoned YAML (plus its generated_pdfs/ entry), and re-merge." >&2
            exit 1
          fi
          SUBMISSION_FILE="$SUBMISSION_FILES"
          echo "submission_file=$SUBMISSION_FILE" >> "$GITHUB_OUTPUT"
          echo "Submission file: $SUBMISSION_FILE"

          CONTRACT_ID=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['contract_id'])" "$SUBMISSION_FILE")
          PERIOD=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['period'])" "$SUBMISSION_FILE")
          SUBMISSION_ID=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['submission_id'])" "$SUBMISSION_FILE")
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      # Gate everything outward-facing on three checks (scripts/verify_approval.py):
      #   - the person who merged is on the engine's approver list
      #     (quantecon.approvers in templates/fiscal-host.yml). The list lives
      #     in the engine, not the contractor repo, so a contractor can't add
      #     themselves; and a merge is otherwise anyone with Write.
      #   - the PR touched only submissions/ and generated_pdfs/, so a
      #     submission PR can't also change a contract, settings or workflow.
      #   - every total recomputes from the entries and the contract on main.
      #     The PR branch is editable, so its YAML totals are a claim, not a
      #     fact.
      # Changed files come from both the merge diff and the PR files API
      # (which also lists a rename's old path), so a rebase-merge that only
      # shows its last commit can't hide anything. On refusal nothing below
      # runs and the failure comment carries the reasons.
      - name: Verify approver, PR scope and totals
        id: verify
        env:
          PYTHONPATH: engine
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          MERGED_BY: ${{ needs.resolve.outputs.merged_by }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
        run: |
          {
            git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA"
            gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'
          } | sort -u > /tmp/changed_files.txt
          echo "Files changed by PR #${PR_NUMBER}:"
          cat /tmp/changed_files.txt
          python -m scripts.verify_approval \
            --submission "$SUBMISSION_FILE" \
            --changed-files /tmp/changed_files.txt \
            --merged-by "$MERGED_BY" \
            --fiscal-host engine/templates/fiscal-host.yml \
            --report /tmp/verify_report.md

      # On a re-run after the commit-back, the YAML on main is already stamped:
      # finalize_approval keeps that stamp (and the PDF that may already have
      # been emailed) instead of restamping with today's date.
      - name: Stamp approval + re-render PDF/PNG
        id: stamp
        env:
          PYTHONPATH: engine
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          MERGED_BY: ${{ needs.resolve.outputs.merged_by }}
        run: |
          python -m scripts.finalize_approval \
            --submission "$SUBMISSION_FILE" \
            --settings config/settings.yml \
            --templates engine/templates \
            --approver "$MERGED_BY"

      # No-op when the ledger already holds this exact entry (a re-run); still
      # fails if it holds the same submission_id with different content.
      - name: Append to ledger YAML
        id: update_ledger
        env:
          PYTHONPATH: engine
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
        run: |
          python -m scripts.update_ledger \
            --submission "$SUBMISSION_FILE"

      - name: Commit re-rendered PDF/PNG + ledger to main
        id: commit_back
        env:
          PYTHONPATH: engine
          PR_NUMBER: ${{ inputs.pr_number }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          MERGED_BY: ${{ needs.resolve.outputs.merged_by }}
        run: |
          git add submissions/ generated_pdfs/ ledger/
          if git diff --cached --quiet; then
            echo "Nothing to commit (re-run: an earlier attempt already committed this)."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Process approved submission from PR #${PR_NUMBER} [skip ci]"
          # Two approvals merging close together both push to main; push_main
          # rebases over the one that landed first and retries. Two approvals
          # on one contract both append to its ledger, so that rebase
          # conflicts. Rather than fail (or text-merge a ledger), push_main
          # resets to the updated main and replays the verify, stamp and
          # ledger steps, which are re-run safe, then pushes the result.
          # Approvals aren't serialised per repo instead: GitHub keeps one
          # waiting run per concurrency group, so a third quick merge would
          # cancel the second's run.
          REPLAY='
          python -m scripts.verify_approval \
            --submission "$SUBMISSION_FILE" \
            --changed-files /tmp/changed_files.txt \
            --merged-by "$MERGED_BY" \
            --fiscal-host engine/templates/fiscal-host.yml \
            --report /tmp/verify_report.md
          python -m scripts.finalize_approval \
            --submission "$SUBMISSION_FILE" \
            --settings config/settings.yml \
            --templates engine/templates \
            --approver "$MERGED_BY"
          python -m scripts.update_ledger \
            --submission "$SUBMISSION_FILE"
          '
          if ! python -m scripts.push_main --replay "$REPLAY" \
               --paths submissions/ generated_pdfs/ ledger/; then
            echo "Nothing was pushed and no email was sent. Once the cause is clear," >&2
            echo "'Re-run failed jobs': the re-run checks out the settled main and" >&2
            echo "appends this submission after any other approval's entry." >&2
            exit 1
          fi
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      - name: Update pinned ledger issue
        id: ledger_issue
        env:
          PYTHONPATH: engine
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRACT_ID: ${{ steps.find_submission.outputs.contract_id }}
          REPO: ${{ github.repository }}
        run: |
          python -m scripts.update_ledger_issue \
            --ledger "ledger/${CONTRACT_ID}.yml" \
            --repo "$REPO"

      # Sent at most once: notify_email records the send in the submission
      # YAML (committed by the next step) and a re-run finds the record and
      # reports it instead of sending again, unless force_resend is set.
      - name: Send approval email
        id: email
        env:
          PYTHONPATH: engine
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Secrets, so the log masks them (issue #20). They used to be org
          # variables, which the log prints verbatim to anyone who can read
          # the contractor repo's Actions runs.
          PSL_EMAIL: ${{ secrets.PSL_EMAIL }}
          QUANTECON_EMAIL_REVIEWER: ${{ secrets.QUANTECON_EMAIL_REVIEWER }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          PERIOD: ${{ steps.find_submission.outputs.period }}
          SUBMISSION_ID: ${{ steps.find_submission.outputs.submission_id }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          FORCE_RESEND: ${{ inputs.force_resend }}
        run: |
          EXTRA=()
          if [ "$FORCE_RESEND" = "true" ]; then
            EXTRA+=(--force-resend)
          fi
          python -m scripts.notify_email \
            --submission "$SUBMISSION_FILE" \
            --settings config/settings.yml \
            --pdf "generated_pdfs/${PERIOD}/${SUBMISSION_ID}.pdf" \
            --fiscal-host engine/templates/fiscal-host.yml \
            --issue-url "https://github.com/${REPO}/issues/${ISSUE_NUMBER}" \
            --output-summary /tmp/email_summary.json \
            "${EXTRA[@]}"

      - name: Record the email send on main
        id: record_email
        env:
          PYTHONPATH: engine
          PR_NUMBER: ${{ inputs.pr_number }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
        run: |
          git add "$SUBMISSION_FILE"
          if git diff --cached --quiet; then
            echo "Nothing to record (the send was recorded by an earlier run)."
            exit 0
          fi
          git commit -m "Record approval email for PR #${PR_NUMBER} [skip ci]"
          if ! python -m scripts.push_main; then
            echo "The approval email WAS sent, but the record of it is not on main," >&2
            echo "so a re-run would send it again. See the failure comment." >&2
            exit 1
          fi

      - name: Post audit comment on the original issue
        id: audit_comment
        # Upserted: a re-run edits the same comment (by its sentinel) rather
        # than adding another, so "Email: not sent" becomes "sent".
        # Not implicit-success(): this comment asserts the submission was
        # located, stamped, ledgered and pushed. When those hold it should
        # post even if a LATER step failed — an SMTP failure then yields
        # the comment reading "Email: not sent" instead of silence.
        if: >-
          ${{ !cancelled()
          && steps.find_submission.outcome == 'success'
          && steps.stamp.outcome == 'success'
          && steps.update_ledger.outcome == 'success'
          && steps.commit_back.outcome == 'success' }}
        env:
          PYTHONPATH: engine
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          CONTRACT_ID: ${{ steps.find_submission.outputs.contract_id }}
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          python -m scripts.notify_comment \
            --submission "$SUBMISSION_FILE" \
            --ledger "ledger/${CONTRACT_ID}.yml" \
            --email-summary /tmp/email_summary.json \
            --issue "$ISSUE_NUMBER" \
            --pr "$PR_NUMBER" \
            --repo "$REPO"

      # Phase 2.5: when this submission supersedes a previous one, post a
      # forward-reference comment on the now-superseded PR so anyone landing
      # on the old PR sees where the authoritative version moved to. The
      # superseded PDF + audit trail stay on the original PR as the record
      # of what was issued to PSL on the original date.
      - name: Comment on the superseded PR (revisions only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          SUPERSEDES_ID=$(python -c "import yaml,sys; \
            d=yaml.safe_load(open(sys.argv[1])); \
            print(d.get('supersedes') or '')" "$SUBMISSION_FILE")
          if [ -z "$SUPERSEDES_ID" ]; then
            echo "Not a revision; skipping superseded-PR comment."
            exit 0
          fi
          echo "Revision detected; locating superseded PR for $SUPERSEDES_ID..."
          # Find the previous merged PR by searching for the superseded
          # submission YAML path in PR bodies (the original PR's body
          # contains a link to the YAML, so the path appears verbatim).
          # Using `<id>.yml` guards against substring matches against the
          # current revision PR (whose body contains `<id>-v2.yml`, which
          # would substring-match `<id>` but not `<id>.yml`). Also filter
          # out the current PR explicitly as belt-and-suspenders.
          PREV_PR=$(gh pr list --repo "$REPO" --state merged \
            --search "\"${SUPERSEDES_ID}.yml\" in:body" --json number \
            --jq "map(select(.number != ${PR_NUMBER})) | first | .number // empty")
          if [ -z "$PREV_PR" ]; then
            echo "Could not locate previous PR for $SUPERSEDES_ID; skipping cross-comment."
            echo "(The revision still landed cleanly; this is a non-fatal audit gap.)"
            exit 0
          fi
          # Re-runs: post it once.
          EXISTING=$(gh api --paginate "repos/${REPO}/issues/${PREV_PR}/comments" \
            --jq ".[] | select(.body | startswith(\"**Superseded by #${PR_NUMBER}.**\")) | .id" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            echo "PR #$PREV_PR already carries the forward reference; skipping."
            exit 0
          fi
          echo "Found previous PR: #$PREV_PR. Posting forward-reference comment."
          gh pr comment "$PREV_PR" --repo "$REPO" --body \
            "**Superseded by #${PR_NUMBER}.** The PDF and audit trail above remain as the record of what was originally issued to PSL on this date. The revision's PDF is the current authoritative version."

      - name: Apply `processed` label to the merged PR
        id: label
        # Explicit rather than implicit so a future `continue-on-error`
        # cannot quietly make a failed run look processed. The runbook
        # treats this label as "done"; a failed run must not wear it.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "processed" \
            --repo "$REPO"

      # ─── Failure reporting ───────────────────────────────────────────────
      # Every step above carries GitHub's implicit success(), so before this
      # existed a mid-pipeline failure silently skipped the ledger, the email,
      # the audit comment and the label, and the only signal was a red run
      # nobody was watching. This says what did and did not happen, and is
      # explicit that the `processed` label was withheld on purpose.
      - name: Report pipeline failure on the PR and issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          O_FIND: ${{ steps.find_submission.outcome }}
          O_VERIFY: ${{ steps.verify.outcome }}
          O_STAMP: ${{ steps.stamp.outcome }}
          O_LEDGER: ${{ steps.update_ledger.outcome }}
          O_COMMIT: ${{ steps.commit_back.outcome }}
          O_ISSUE: ${{ steps.ledger_issue.outcome }}
          O_EMAIL: ${{ steps.email.outcome }}
          O_RECORD: ${{ steps.record_email.outcome }}
          O_AUDIT: ${{ steps.audit_comment.outcome }}
        run: |
          row() {
            case "$2" in
              success) MARK="✅ completed" ;;
              failure) MARK="❌ **FAILED**" ;;
              skipped|"") MARK="⏭️ did not run" ;;
              *) MARK="$2" ;;
            esac
            printf '| %s | %s |\n' "$1" "$MARK"
          }

          # The email is the outward-facing consequence, so state it plainly:
          # recovery differs entirely depending on whether the fiscal host has
          # already been contacted.
          if [ "$O_EMAIL" = "success" ] && [ "$O_RECORD" = "failure" ]; then
            EMAIL_LINE='The approval email **was sent**, but recording that on main failed, so a re-run **would send it again**. If every other step above completed, finish by hand instead: apply the `processed` label to this PR.'
          elif [ "$O_EMAIL" = "success" ]; then
            EMAIL_LINE='The approval email **was sent** and recorded; a re-run will not send it again.'
          else
            EMAIL_LINE='**No approval email was sent.** The fiscal host has not been contacted for this submission.'
          fi

          {
            printf '> [!CAUTION]\n'
            printf '> **The approval pipeline failed part-way through.**\n\n'
            printf '| Step | Outcome |\n|---|---|\n'
            row "1. Find submission"      "$O_FIND"
            row "2. Verify approval"      "$O_VERIFY"
            row "3. Stamp approval"       "$O_STAMP"
            row "4. Append to ledger"     "$O_LEDGER"
            row "5. Commit back to main"  "$O_COMMIT"
            row "6. Pinned ledger issue"  "$O_ISSUE"
            row "7. Approval email"       "$O_EMAIL"
            row "8. Record email on main" "$O_RECORD"
            row "9. Audit comment"        "$O_AUDIT"
            printf '\n%s\n\n' "$EMAIL_LINE"
            # The verifier's refusal report says why and what to do.
            if [ -f /tmp/verify_report.md ]; then
              cat /tmp/verify_report.md
              printf '\n'
            else
              printf '**To recover:** fix the cause, then use **Re-run failed jobs** on the run below. '
              printf 'Steps that already completed are skipped, and the approval email is sent at most once. '
              printf 'If the run is too old to re-run, start *Process approved submission* from the '
              printf 'Actions tab with this PR number.\n\n'
            fi
            printf 'Run log: %s\n\n' "$RUN_URL"
            printf 'The `processed` label was deliberately not applied, so this PR stays visible as unfinished.\n'
          } > /tmp/failure_comment.md

          # Post to both surfaces; a comment failure must not hide the original
          # failure, so each is tolerated individually (the job is already red).
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/failure_comment.md \
            || echo "WARN: could not post failure comment on PR #${PR_NUMBER}."
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "$PR_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/failure_comment.md \
              || echo "WARN: could not post failure comment on issue #${ISSUE_NUMBER} (locked?)."
          fi
