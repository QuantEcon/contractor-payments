name: Process approved submission (reusable)

# Reusable workflow that runs after a submission PR merges:
#   1. Stamp the submission YAML with approval metadata (status, approved_by,
#      approved_date) and re-render PDF + PNG (amber → green block).
#   2. Append the submission to ledger/<contract-id>.yml (or the per-repo
#      ledger/reimbursements.yml for contractor-level reimbursement claims).
#   3. Commit the re-rendered files + ledger update back to main.
#   4. Edit the pinned ledger issue with the updated running totals.
#   5. Send the approval email to PSL (or admin only, if testing_mode=true)
#      with the approved PDF attached.
#   6. Post an internal audit comment on the original submission issue
#      confirming the merge, the ledger update, and the email send.
#   7. Apply the `processed` label to the closed PR.
#
# Failure gating: every step below carries GitHub's implicit `success()`
# unless stated otherwise, so a mid-pipeline failure skips everything
# downstream. Two deliberate exceptions keep that failure *visible*:
#   • the audit comment (step 6) runs whenever the submission was located,
#     stamped, ledgered and committed — so an SMTP failure still produces
#     an audit comment reading "Email: ⚠️ not sent" rather than silence;
#   • a final `if: failure()` step posts a loud per-step outcome table on
#     the PR and the issue.
# The `processed` label stays `success()`-gated: a failed run must never
# look processed. See notes/ADMIN_RUNBOOK.md §6.
#
# Branch-protection note: this workflow pushes directly to main (step 3).
# That requires either no branch protection on main OR `github-actions[bot]`
# being on the "Allow specified actors to bypass required pull requests"
# list. For Phase 2 testing on test-contractor-payments (no protection), works
# as-is. For Phase 4 onboarding of real contractor repos (which DO enable
# branch protection per PLAN §11), the onboarding script will need to add
# github-actions[bot] to the bypass list — track this as a Phase 4 task.
#
# See PLAN.md §8 Phase 2.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      pr_body:
        required: true
        type: string
      merge_commit_sha:
        required: true
        type: string
      merged_by:
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out the contractor repo at main
        uses: actions/checkout@v4
        with:
          # Full history, for two reasons:
          #   1. We diff the merge commit against its first parent. With a
          #      shallow clone, any merge that lands while main advances
          #      (batched approvals — normal from Phase 5 on) puts
          #      ${MERGE_SHA}^1 outside the clone and the run dies with a
          #      misleading "no submission found".
          #   2. The commit-back step rebases onto origin/main on push
          #      rejection, which needs real history to replay onto.
          fetch-depth: 0
          ref: main

      - name: Check out the engine repo (scripts + templates)
        uses: actions/checkout@v4
        with:
          repository: QuantEcon/contractor-payments
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Typst
        run: |
          TYPST_VERSION="0.13.0"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C /tmp
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find the submission YAML in the merge commit
        id: find_submission
        env:
          MERGE_SHA: ${{ inputs.merge_commit_sha }}
        run: |
          # Before diffing, prove the merge commit AND its first parent are
          # actually in this clone. Without this check a too-shallow (or
          # rewritten) history fails inside `git diff` and reports the
          # completely misleading "No submissions/*.yml found" — an
          # infrastructure problem wearing a data problem's error message.
          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: merge commit $MERGE_SHA is not present in this clone." >&2
            echo "This is NOT 'no submission in the merge' — the commit itself is missing." >&2
            echo "Likely cause: main was force-pushed/rewritten since the merge, or the" >&2
            echo "checkout above no longer fetches full history (fetch-depth must be 0)." >&2
            exit 1
          fi
          if ! git cat-file -e "${MERGE_SHA}^1^{commit}" 2>/dev/null; then
            echo "ERROR: first parent of $MERGE_SHA is not present in this clone." >&2
            echo "This is NOT 'no submission in the merge' — the diff base is missing." >&2
            echo "Likely cause: the checkout is shallow (fetch-depth must be 0), so the" >&2
            echo "pre-merge tip of main was never fetched." >&2
            exit 1
          fi

          # Files added/changed by the merge — diff against the first parent
          # (i.e. main's HEAD before the merge). `git diff-tree` on a merge
          # commit is silent by default, hence the explicit parent compare.
          SUBMISSION_FILES=$(git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" \
            | grep -E '^submissions/.*\.yml$' || true)
          if [ -z "$SUBMISSION_FILES" ]; then
            echo "ERROR: merge commit $MERGE_SHA is present and its parent is reachable," >&2
            echo "but it genuinely changed no submissions/*.yml file." >&2
            echo "--- All files changed by the merge: ---" >&2
            git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" >&2 || true
            exit 1
          fi
          # Refuse to guess. A merge carrying more than one submission means
          # the branch accumulated an abandoned claim (e.g. the period was
          # corrected before merge), and the previous `head -1` silently
          # approved whichever path sorted first — for a forward period
          # correction, the abandoned one. Fail loudly instead: nothing is
          # stamped, ledgered or emailed until an admin resolves it.
          SUBMISSION_COUNT=$(printf '%s\n' "$SUBMISSION_FILES" | wc -l | tr -d ' ')
          if [ "$SUBMISSION_COUNT" -gt 1 ]; then
            echo "ERROR: merge $MERGE_SHA carries $SUBMISSION_COUNT submission files;" >&2
            echo "refusing to guess which one was approved." >&2
            printf '%s\n' "$SUBMISSION_FILES" >&2
            echo "Fix: keep one submission per PR — revert the merge, drop the" >&2
            echo "abandoned YAML (plus its generated_pdfs/ and receipts/ entries)," >&2
            echo "and re-merge." >&2
            exit 1
          fi
          SUBMISSION_FILE="$SUBMISSION_FILES"
          echo "submission_file=$SUBMISSION_FILE" >> "$GITHUB_OUTPUT"
          echo "Submission file: $SUBMISSION_FILE"

          # contract_id is absent on contractor-level reimbursement claims;
          # those use the per-repo ledger/reimbursements.yml instead.
          CONTRACT_ID=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1])).get('contract_id') or '')" "$SUBMISSION_FILE")
          TYPE=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1])).get('type') or '')" "$SUBMISSION_FILE")
          PERIOD=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['period'])" "$SUBMISSION_FILE")
          SUBMISSION_ID=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['submission_id'])" "$SUBMISSION_FILE")
          if [ "$TYPE" = "reimbursement" ]; then
            LEDGER_FILE="ledger/reimbursements.yml"
          else
            LEDGER_FILE="ledger/${CONTRACT_ID}.yml"
          fi
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "ledger_file=$LEDGER_FILE" >> "$GITHUB_OUTPUT"
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      - name: Extract original issue number from PR body
        id: find_issue
        env:
          PR_BODY: ${{ inputs.pr_body }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # PR body contains "Closes #N" per create_submission_pr.py
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "WARN: No 'Closes #N' found in PR body; falling back to PR number $PR_NUMBER" >&2
            ISSUE_NUMBER="$PR_NUMBER"
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Original issue: #$ISSUE_NUMBER"

      # The submission path comes out of the merge diff, i.e. it is authored
      # by whoever pushed the submission branch. Same for `merged_by`. Pass
      # both through `env:` rather than interpolating into the shell — this
      # job holds the SMTP secrets, so no externally-authored string gets to
      # be parsed as shell here.
      - name: Stamp approval + re-render PDF/PNG
        id: stamp
        env:
          PYTHONPATH: engine
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          MERGED_BY: ${{ inputs.merged_by }}
        run: |
          python -m scripts.finalize_approval \
            --submission "$SUBMISSION_FILE" \
            --settings config/settings.yml \
            --templates engine/templates \
            --approver "$MERGED_BY"

      - name: Append to ledger YAML
        id: update_ledger
        env:
          PYTHONPATH: engine
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
        run: |
          python -m scripts.update_ledger \
            --submission "$SUBMISSION_FILE"

      - name: Commit re-rendered PDF/PNG + ledger to main
        id: commit_back
        run: |
          # receipts/ arrived on main via the merge itself; only the
          # re-rendered artifacts + ledger need committing back.
          git add submissions/ generated_pdfs/ ledger/
          if git diff --cached --quiet; then
            echo "Nothing to commit (idempotent re-run on already-processed PR?)"
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Process approved submission from PR #${{ inputs.pr_number }} [skip ci]"

            # Bounded fetch + rebase + retry. Two approvals merging within
            # seconds of each other used to be exotic; from Phase 5 a repo has
            # three submission types sharing one ledger directory, so batched
            # merges are the norm. The loser's push is rejected non-fast-forward,
            # and everything downstream (email, audit comment, label) is
            # success()-gated — so a lost race used to silently swallow the
            # approval email. Rebase onto the new main and try again.
            #
            # Bounded, and a conflicting rebase aborts rather than resolving
            # anything: the ledger is money, so an unclear merge must stop the
            # run for an admin, not be guessed at.
            PUSHED=false
            for ATTEMPT in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                PUSHED=true
                echo "Pushed to main on attempt ${ATTEMPT}."
                break
              fi
              echo "Push rejected (attempt ${ATTEMPT}/5) — another approval likely landed first."
              git fetch origin main
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo "ERROR: rebase onto the updated main conflicted." >&2
                echo "Another approval appended to the same ledger file at the same place." >&2
                echo "Nothing has been pushed; no email sent; the ledger on main still has" >&2
                echo "only the other approval's entry." >&2
                echo "Fix: 'Re-run failed jobs' — the re-run checks out the settled main and" >&2
                echo "appends this submission after the other entry, which replays cleanly." >&2
                echo "See notes/ADMIN_RUNBOOK.md §6." >&2
                exit 1
              fi
              # No point backing off after the final attempt — the loop is
              # about to exit and the run fails either way.
              if [ "$ATTEMPT" -lt 5 ]; then
                sleep $((ATTEMPT * 3))
              fi
            done
            if [ "$PUSHED" != "true" ]; then
              echo "ERROR: could not push to main after 5 attempts (persistent contention" >&2
              echo "or a rejected push — e.g. branch protection). Nothing downstream ran:" >&2
              echo "no email, no audit comment, no processed label." >&2
              exit 1
            fi
            echo "did_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned ledger issue
        id: ledger_issue
        env:
          PYTHONPATH: engine
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEDGER_FILE: ${{ steps.find_submission.outputs.ledger_file }}
        run: |
          python -m scripts.update_ledger_issue \
            --ledger "$LEDGER_FILE" \
            --repo "${{ github.repository }}"

      - name: Send approval email
        id: email
        env:
          PYTHONPATH: engine
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PSL_EMAIL: ${{ vars.PSL_EMAIL }}
          QUANTECON_EMAIL_REVIEWER: ${{ vars.QUANTECON_EMAIL_REVIEWER }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          PERIOD: ${{ steps.find_submission.outputs.period }}
          SUBMISSION_ID: ${{ steps.find_submission.outputs.submission_id }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          # --receipts-dir only matters for reimbursement claims; for other
          # types the directory doesn't exist and is tolerated (no receipts
          # attached).
          python -m scripts.notify_email \
            --submission "$SUBMISSION_FILE" \
            --settings config/settings.yml \
            --pdf "generated_pdfs/${PERIOD}/${SUBMISSION_ID}.pdf" \
            --fiscal-host engine/templates/fiscal-host.yml \
            --receipts-dir "receipts/${PERIOD}/${SUBMISSION_ID}" \
            --issue-url "https://github.com/${{ github.repository }}/issues/${ISSUE_NUMBER}" \
            --output-summary /tmp/email_summary.json

      # Deliberately NOT plain success(): the audit comment is the record of
      # what happened, so it must also post when the pipeline broke *after*
      # the ledger was committed. Everything the comment asserts (stamped,
      # ledgered, committed) is verified by the outcome checks below; the
      # email line reads "⚠️ not sent" whenever notify_email did not write
      # its summary, which is exactly the oversized-attachment / SMTP-outage
      # case documented in the runbook §10 (email size failure).
      # `!cancelled()` rather than `always()` — a cancelled run should not
      # narrate itself as an outcome.
      - name: Post audit comment on the original issue
        id: audit_comment
        if: >-
          ${{ !cancelled()
          && steps.find_submission.outcome == 'success'
          && steps.stamp.outcome == 'success'
          && steps.update_ledger.outcome == 'success'
          && steps.commit_back.outcome == 'success' }}
        env:
          PYTHONPATH: engine
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
          LEDGER_FILE: ${{ steps.find_submission.outputs.ledger_file }}
        run: |
          python -m scripts.notify_comment \
            --submission "$SUBMISSION_FILE" \
            --ledger "$LEDGER_FILE" \
            --email-summary /tmp/email_summary.json \
            --issue ${{ steps.find_issue.outputs.issue_number }} \
            --pr ${{ inputs.pr_number }} \
            --repo "${{ github.repository }}"

      # Phase 2.5: when this submission supersedes a previous one, post a
      # forward-reference comment on the now-superseded PR so anyone landing
      # on the old PR sees where the authoritative version moved to. The
      # superseded PDF + audit trail stay on the original PR as the record
      # of what was issued to PSL on the original date.
      - name: Comment on the superseded PR (revisions only)
        id: superseded_comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_FILE: ${{ steps.find_submission.outputs.submission_file }}
        run: |
          # Path via argv, not interpolated into the python source string —
          # the path is authored by whoever pushed the submission branch.
          SUPERSEDES_ID=$(python -c "import yaml,sys; \
            d=yaml.safe_load(open(sys.argv[1])); \
            print(d.get('supersedes') or '')" "$SUBMISSION_FILE")
          if [ -z "$SUPERSEDES_ID" ]; then
            echo "Not a revision; skipping superseded-PR comment."
            exit 0
          fi
          echo "Revision detected; locating superseded PR for $SUPERSEDES_ID..."
          # Find the previous merged PR by searching for the superseded
          # submission YAML path in PR bodies (the original PR's body
          # contains a link to the YAML, so the path appears verbatim).
          # Using `<id>.yml` guards against substring matches against the
          # current revision PR (whose body contains `<id>-v2.yml`, which
          # would substring-match `<id>` but not `<id>.yml`). Also filter
          # out the current PR explicitly as belt-and-suspenders.
          PREV_PR=$(gh pr list --repo "${{ github.repository }}" --state merged \
            --search "\"${SUPERSEDES_ID}.yml\" in:body" --json number \
            --jq "map(select(.number != ${{ inputs.pr_number }})) | first | .number // empty")
          if [ -z "$PREV_PR" ]; then
            echo "Could not locate previous PR for $SUPERSEDES_ID; skipping cross-comment."
            echo "(The revision still landed cleanly; this is a non-fatal audit gap.)"
            exit 0
          fi
          echo "Found previous PR: #$PREV_PR. Posting forward-reference comment."
          gh pr comment "$PREV_PR" --repo "${{ github.repository }}" --body \
            "**Superseded by #${{ inputs.pr_number }}.** The PDF and audit trail above remain as the record of what was originally issued to PSL on this date. The revision's PDF is the current authoritative version."

      # Explicitly success() — same as the implicit default, spelled out
      # because it is load-bearing: `processed` is how an admin scanning
      # merged PRs tells "this one is done" from "this one needs attention".
      # A failed run must never wear that label.
      - name: Apply `processed` label to the merged PR
        id: label
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ inputs.pr_number }}" --add-label "processed" \
            --repo "${{ github.repository }}"

      # ─── Failure path ─────────────────────────────────────────────────────
      # Runs only when some step above failed (`failure()` — not on
      # cancellation). Reports the per-step outcome table on both the merged
      # PR and the originating issue so a broken run is impossible to miss:
      # before this existed, a failure after the merge was silent on every
      # GitHub surface and only visible to whoever thought to open Actions.
      #
      # This step succeeding does NOT clear the job's failed conclusion, so
      # the run stays red and the `processed` label above stays unapplied.
      # It may post *alongside* the audit comment (when the failure was in
      # the pinned-issue or email step); that duplication is intentional —
      # the audit comment records state, this one names the broken step.
      - name: Report pipeline failure on the PR and issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          O_FIND_SUBMISSION: ${{ steps.find_submission.outcome }}
          O_FIND_ISSUE: ${{ steps.find_issue.outcome }}
          O_STAMP: ${{ steps.stamp.outcome }}
          O_LEDGER: ${{ steps.update_ledger.outcome }}
          O_COMMIT: ${{ steps.commit_back.outcome }}
          O_LEDGER_ISSUE: ${{ steps.ledger_issue.outcome }}
          O_EMAIL: ${{ steps.email.outcome }}
          O_AUDIT: ${{ steps.audit_comment.outcome }}
          O_SUPERSEDED: ${{ steps.superseded_comment.outcome }}
          O_LABEL: ${{ steps.label.outcome }}
        run: |
          ROWS=""
          FAILED=""
          add_row() {  # add_row <label> <outcome>
            local label="$1" outcome="$2" rendered
            case "$outcome" in
              success)   rendered="✅ completed" ;;
              failure)   rendered="❌ **FAILED**"
                         if [ -z "$FAILED" ]; then FAILED="$label"; fi ;;
              cancelled) rendered="🚫 cancelled" ;;
              skipped|"") rendered="⏭️ did not run" ;;
              *)         rendered="❔ $outcome" ;;
            esac
            ROWS="${ROWS}| ${label} | ${rendered} |"$'\n'
          }
          add_row "1. Locate submission YAML in the merge" "$O_FIND_SUBMISSION"
          add_row "2. Resolve originating issue"            "$O_FIND_ISSUE"
          add_row "3. Stamp approval + re-render PDF/PNG"   "$O_STAMP"
          add_row "4. Append to ledger YAML"                "$O_LEDGER"
          add_row "5. Commit + push back to \`main\`"       "$O_COMMIT"
          add_row "6. Update pinned ledger issue"           "$O_LEDGER_ISSUE"
          add_row "7. Send approval email"                 "$O_EMAIL"
          add_row "8. Post audit comment"                   "$O_AUDIT"
          add_row "9. Comment on superseded PR"             "$O_SUPERSEDED"
          add_row "10. Apply \`processed\` label"           "$O_LABEL"

          if [ "$O_EMAIL" = "success" ]; then
            EMAIL_LINE="The approval email **was sent** (step 7 completed) — do not re-send it during recovery."
          else
            EMAIL_LINE="**No approval email was sent.** The fiscal host has not been contacted for this submission."
          fi
          if [ -z "$FAILED" ]; then
            FAILED="(see the run log — the failing step is not in the table above)"
          fi

          {
            printf '> [!CAUTION]\n'
            printf '> **Approval pipeline FAILED — this submission is NOT fully processed.**\n\n'
            printf 'PR #%s merged, but `process-approved.yml` did not run to completion.\n\n' "$PR_NUMBER"
            printf 'Failed step: **%s**\n\n' "$FAILED"
            printf '| Step | Outcome |\n| --- | --- |\n'
            printf '%s\n' "$ROWS"
            printf '%s\n\n' "$EMAIL_LINE"
            printf 'Run log: %s\n\n' "$RUN_URL"
            printf 'Recovery: see `notes/ADMIN_RUNBOOK.md` §6 "Workflow failure mid-pipeline". '
            printf 'The `processed` label was deliberately not applied, so this PR stays visible as unfinished.\n'
          } > /tmp/failure_comment.md

          # Post to both surfaces; a comment failure here must not hide the
          # original failure, so each is tolerated individually (the job is
          # already red either way).
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/failure_comment.md \
            || echo "WARN: could not post failure comment on PR #${PR_NUMBER}."
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "$PR_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/failure_comment.md \
              || echo "WARN: could not post failure comment on issue #${ISSUE_NUMBER} (locked?)."
          fi
