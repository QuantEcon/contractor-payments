name: Process submission (reusable)

# Reusable workflow that handles a contractor-repo submission issue. Two
# modes, selected by the caller via the `mode` input:
#
#   submit   — parse the issue body and (on success) open a PR with
#              structured YAML + rendered PDF + PNG preview. Close the
#              originating issue (not locked: see the close step). Remove the `submit` label if
#              present. Same downstream behaviour as pre-Phase-3c flow.
#
#   validate — parse the issue body in dry-run mode and post a
#              sentinel-marked validate-result comment on the issue.
#              No branch, no commit, no PR. Lets contractors check parse
#              correctness + computed totals before triggering `/submit`.
#
# Two checkouts:
#   1. The CALLING repo (contractor-{handle}) at the working directory —
#      this is where contracts/, settings, submissions/, generated_pdfs/
#      live, and where the new branch + PR will be created (submit mode).
#   2. This (engine) repo at ./engine — provides scripts/ + templates/.
#
# Scripts run with PYTHONPATH=engine so `python -m scripts.X` resolves
# against the engine checkout, while paths into the working tree refer to
# the contractor repo's files.
#
# See PLAN.md §8 Phase 3a (reusable workflow shape) + Phase 3c (mode + /validate).

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      issue_title:
        required: true
        type: string
      issue_author:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      event_action:
        description: >
          The triggering event action ('labeled', 'reopened', 'created' for
          issue_comment, etc.). Kept for diagnostics / future routing.
          Revision intent is filesystem-derived (find_previous_submission.py),
          not event-derived.
        required: false
        type: string
        default: ""
      mode:
        description: >
          'submit' (default) — parse + open PR + close issue + remove
          submit label. 'validate' — parse dry-run + post sentinel-marked
          result comment, no PR. See PLAN §8 Phase 3c.
        required: false
        type: string
        default: "submit"

      engine_ref:
        description: >
          Which engine commit-ish to run the scripts from. MUST match the ref
          this workflow is called at in the caller's `uses:` line, or the
          pipeline definition and the code it drives come from different
          commits. Optional, defaulting to 'main': a caller that pins `@main`
          and omits this gets exactly the previous behaviour.
        required: false
        type: string
        default: "main"

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out the contractor repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the scripts from the same engine commit as this workflow file.
      #
      # `actions/checkout` with no `ref:` takes the engine's default branch, so
      # a caller pinned to `@some-branch` got that branch's workflow YAML
      # driving `main`'s scripts. The mismatch stays invisible until the YAML
      # passes a flag the scripts do not have.
      #
      # The ref has to come from the caller: there is no context value for it.
      # `github.job_workflow_ref` and `github.job_workflow_sha` both read as
      # EMPTY here (verified on real runs), and `github.workflow_ref` /
      # `github.workflow_sha` describe the *calling* workflow in the contractor
      # repo, not this one.
      - name: Check out the engine repo (scripts + templates)
        uses: actions/checkout@v4
        with:
          repository: QuantEcon/contractor-payments
          ref: ${{ inputs.engine_ref }}
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml==6.0.3

      - name: Install Typst (submit mode only)
        if: inputs.mode == 'submit'
        run: |
          # Bump the version and the sha256 together (the tarball's, for this
          # version); tests/test_workflows.py checks every workflow agrees.
          TYPST_VERSION="0.13.0"
          TYPST_SHA256="cd1148da61d6844e62c330fc6222e988480acafe33b76daec8eb5d221258feb6"
          curl -fsSL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          # Refuse a tarball that isn't the one we pinned (bash -e stops here).
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJ -C /tmp -f /tmp/typst.tar.xz
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Configure git identity (submit mode only)
        if: inputs.mode == 'submit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write issue body to file
        env:
          ISSUE_BODY: ${{ inputs.issue_body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.md

      - name: Parse the issue
        id: parse
        env:
          PYTHONPATH: engine
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          PARSE_RC=0
          python -m scripts.parse_issue \
            --body-file /tmp/issue_body.md \
            --output-json /tmp/submission.json \
            --output-errors-json /tmp/errors.json \
            || PARSE_RC=$?
          # Check the parsed claim against its contract and ledger (ended
          # contract, dates outside the contract, milestone already paid...).
          # Findings join the parser's errors.json, so they reach the
          # contractor as the usual "needs a fix" comment; on any error the
          # script deletes submission.json, which routes this run down the
          # parse-failure path below. A crash here fails the step (engine
          # fault), same as a crash in the parser.
          if [ -f /tmp/submission.json ]; then
            python -m scripts.check_submission \
              --submission-file /tmp/submission.json \
              --errors-file /tmp/errors.json \
              --issue "$ISSUE_NUMBER"
          fi
          if [ -f /tmp/submission.json ]; then
            echo "parse_ok=true" >> "$GITHUB_OUTPUT"
          elif [ -f /tmp/errors.json ]; then
            # The parser ran and rejected the body: a data error the
            # contractor can fix. Stay green so the error-comment steps run.
            echo "parse_ok=false" >> "$GITHUB_OUTPUT"
          else
            # Neither artifact exists, so the parser never got far enough to
            # judge the body — bad flags, an import error, a missing config.
            # That is an engine fault, and reporting it to the contractor as
            # "your submission needs a fix" is both false and self-defeating:
            # the error-comment step then crashes on the absent errors.json.
            # Fail instead, so the failure comment says it is not their text.
            echo "ERROR: scripts.parse_issue exited ${PARSE_RC} without writing" >&2
            echo "/tmp/submission.json or /tmp/errors.json. Treating this as an" >&2
            echo "engine failure, not a submission error." >&2
            exit 1
          fi

      # ─── /validate path ───────────────────────────────────────────────────
      # Dry-run parser pass; post a sentinel-marked result comment, no PR.

      - name: Post validate-success comment
        if: inputs.mode == 'validate' && steps.parse.outputs.parse_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          CONTRACT_ID=$(python -c "import json; print(json.load(open('/tmp/submission.json'))['contract_id'])")
          python -m scripts.post_validate_result success \
            --submission-file /tmp/submission.json \
            --errors-file /tmp/errors.json \
            --contract-file "contracts/${CONTRACT_ID}.yml" \
            --submitter "$ISSUE_AUTHOR" \
            --issue "$ISSUE_NUMBER"

      - name: Post validate-error comment
        if: inputs.mode == 'validate' && steps.parse.outputs.parse_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python -m scripts.post_validate_result error \
            --errors-file /tmp/errors.json \
            --issue "$ISSUE_NUMBER"

      # ─── /submit path ─────────────────────────────────────────────────────
      # Phase 2.5: revision intent comes from filesystem state — not the
      # event action. If any approved submission exists for this issue,
      # the run is a revision regardless of whether the trigger was a
      # comment, a label, or a reopen.

      - name: Detect revision target
        id: revision
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true'
        env:
          PYTHONPATH: engine
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          SUPERSEDES=$(python -m scripts.find_previous_submission \
            --issue "$ISSUE_NUMBER")
          echo "supersedes=$SUPERSEDES" >> "$GITHUB_OUTPUT"
          if [ -n "$SUPERSEDES" ]; then
            echo "Previous approved submission detected; this is a revision superseding: $SUPERSEDES"
          else
            echo "No previously approved submission for this issue; treating as fresh submission."
          fi

      - name: Create submission PR
        id: create_pr
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          SUPERSEDES: ${{ steps.revision.outputs.supersedes }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
        run: |
          SUPERSEDES_ARGS=()
          if [ -n "$SUPERSEDES" ]; then
            SUPERSEDES_ARGS=(--supersedes "$SUPERSEDES")
          fi
          python -m scripts.create_submission_pr \
            --submission-file /tmp/submission.json \
            --errors-file /tmp/errors.json \
            --issue-number "$ISSUE_NUMBER" \
            --issue-author "$ISSUE_AUTHOR" \
            --issue-title "$ISSUE_TITLE" \
            --templates-dir engine/templates \
            "${SUPERSEDES_ARGS[@]}"

      - name: Clear prior submit-error comment
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python -m scripts.post_error_comment clear \
            --issue "$ISSUE_NUMBER"

      - name: Clear prior validate-result comment
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python -m scripts.post_validate_result clear \
            --issue "$ISSUE_NUMBER"

      # Closed, deliberately NOT locked. Contractors are Triage collaborators
      # (no Write), and only Write+ can unlock an issue or reliably comment on
      # a locked one — so a lock would strand the revision path (reopen, edit,
      # `/submit`). The PR's YAML is the record of what was filed; later edits
      # to this issue's body change nothing unless `/submit` runs again.
      - name: Close the issue
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          # Look up the PR that create_submission_pr just opened (or updated)
          # for this issue. Branch name is deterministic per
          # branch_name_for_issue() in create_submission_pr.py.
          BRANCH="submission/issue-${ISSUE_NUMBER}"
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            WHERE="see #${PR_NUMBER}"
          else
            WHERE="see the PR linked above"
          fi
          COMMENT="Submission filed — ${WHERE}. This issue is now closed. To correct the submission, reopen this issue, edit the entries, and comment \`/submit\` again (before approval this updates the PR; after approval it files a revision)."
          gh issue close "$ISSUE_NUMBER" \
            --comment "$COMMENT" \
            || echo "Issue close failed (may already be closed); continuing."

      - name: Post submit-error comment (on parse failure)
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python -m scripts.post_error_comment post \
            --errors-file /tmp/errors.json \
            --issue "$ISSUE_NUMBER"

      # ─── Genuinely always (submit mode) ──────────────────────────────────
      # The label is the contractor's only retry handle — the caller fires on
      # `issues: [labeled]` — so a failed run that keeps it strands them with
      # no way to re-fire the event. `always()` rather than the implicit
      # success() the banner used to claim. Placed before the failure comment
      # below so that comment's "the label has been removed" is true when read.
      - name: Remove `submit` label
        if: ${{ always() && inputs.mode == 'submit' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label submit \
            || echo "submit label not present; continuing."

      # ─── Failure reporting ───────────────────────────────────────────────
      # Without this, ANY step failure skipped everything downstream and the
      # contractor got nothing back — moments after /validate said "ready to
      # submit". The existing submit-error comment above only covers parse
      # failures, which are captured as a step *output*, not a step failure.
      - name: Post pipeline-failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          O_PARSE: ${{ steps.parse.outcome }}
          O_CREATE_PR: ${{ steps.create_pr.outcome }}
        run: |
          if [ "$MODE" = "validate" ]; then
            HEADLINE='`/validate` failed before it could report a result.'
            OUTCOME='Nothing was changed. Re-run `/validate` once the cause below is fixed.'
          elif [ "$O_CREATE_PR" = "success" ]; then
            HEADLINE='`/submit` failed **after** the submission PR was created.'
            OUTCOME='The PR exists and carries your submission, but the follow-up housekeeping did not finish. **Do not re-submit** — an admin will pick this up from the run log.'
          else
            HEADLINE='`/submit` failed — **nothing was filed.**'
            OUTCOME='No submission PR was created. The `submit` label has been removed, so re-applying it retries the run once the cause below is fixed.'
          fi

          if [ "$O_PARSE" = "failure" ]; then
            STAGE="parsing the submission"
          elif [ "$O_CREATE_PR" = "failure" ]; then
            STAGE="rendering the PDF and opening the submission PR"
          else
            STAGE="workflow setup (checkout / Python / Typst install)"
          fi

          {
            printf '> [!WARNING]\n'
            printf '> %s\n\n' "$HEADLINE"
            printf 'This is not a problem with the text of your submission (a bad submission comes back as a "needs a fix" comment listing the lines). The run broke at this stage: **%s**.\n\n' "$STAGE"
            printf '%s\n\n' "$OUTCOME"
            printf 'Run log (admins): %s\n' "$RUN_URL"
          } > /tmp/failure_comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body-file /tmp/failure_comment.md \
            || echo "WARN: could not post the failure comment on #${ISSUE_NUMBER} (locked?)."
