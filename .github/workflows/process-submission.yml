name: Process submission (reusable)

# Reusable workflow that handles a contractor-repo submission issue. Two
# modes, selected by the caller via the `mode` input:
#
#   submit   — parse the issue body and (on success) open a PR with
#              structured YAML + rendered PDF + PNG preview. Close and
#              lock the originating issue. Remove the `submit` label if
#              present. Same downstream behaviour as pre-Phase-3c flow.
#
#   validate — parse the issue body in dry-run mode and post a
#              sentinel-marked validate-result comment on the issue.
#              No branch, no commit, no PR. Lets contractors check parse
#              correctness + computed totals before triggering `/submit`.
#
# Two checkouts:
#   1. The CALLING repo (contractor-{handle}) at the working directory —
#      this is where contracts/, settings, submissions/, generated_pdfs/
#      live, and where the new branch + PR will be created (submit mode).
#   2. This (engine) repo at ./engine — provides scripts/ + templates/.
#
# Scripts run with PYTHONPATH=engine so `python -m scripts.X` resolves
# against the engine checkout, while paths into the working tree refer to
# the contractor repo's files.
#
# Failure gating: data errors (unparseable body, unfetchable receipt) are
# carried as step *outputs*, so the run stays green and the contractor gets
# the "needs a fix" comment. Anything else — a crash in Typst, `gh`, or a
# script — is a step failure, and the two steps at the bottom of the job
# (`always()` label removal + `failure()` comment) make sure /submit still
# says something and can still be retried. See PLAN.md §8 Phase 3a
# (reusable workflow shape) + Phase 3c (mode + /validate).

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      issue_title:
        required: true
        type: string
      issue_author:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      event_action:
        description: >
          The triggering event action ('labeled', 'reopened', 'created' for
          issue_comment, etc.). Kept for diagnostics / future routing.
          Revision intent is filesystem-derived (find_previous_submission.py),
          not event-derived.
        required: false
        type: string
        default: ""
      mode:
        description: >
          'submit' (default) — parse + open PR + close/lock issue + remove
          submit label. 'validate' — parse dry-run + post sentinel-marked
          result comment, no PR. See PLAN §8 Phase 3c.
        required: false
        type: string
        default: "submit"

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out the contractor repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve which engine commit to run, BEFORE checking it out.
      #
      # `actions/checkout` with no `ref:` takes the engine's default branch, so
      # a caller pinned to `@some-branch` got that branch's workflow YAML
      # driving `main`'s scripts. The mismatch is invisible until the YAML
      # passes a flag the scripts don't have — which is how it surfaced:
      # `parse_issue.py: error: unrecognized arguments: --reimbursements`.
      #
      # `github.job_workflow_ref` is this reusable workflow's own path@ref, e.g.
      # `QuantEcon/contractor-payments/.github/workflows/process-submission.yml@refs/heads/main`.
      # (`github.job_workflow_sha` looks like the obvious choice but is empty in
      # the github context — verified on a real run, hence the hard failure
      # below rather than a silent fallback.)
      - name: Resolve the engine ref (this workflow's own commit)
        id: engine_ref
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: |
          if [ -z "$JOB_WORKFLOW_REF" ]; then
            echo "ERROR: github.job_workflow_ref is empty, so the engine ref" >&2
            echo "cannot be resolved. Checking out the default branch instead" >&2
            echo "would risk running scripts that do not match this pipeline," >&2
            echo "so this run stops here." >&2
            exit 1
          fi
          # Strip the `<path>.yml@` prefix; a branch name may itself contain
          # `@`, so anchor on the filename rather than the last `@`.
          ENGINE_REF="${JOB_WORKFLOW_REF#*.yml@}"
          if [ -z "$ENGINE_REF" ] || [ "$ENGINE_REF" = "$JOB_WORKFLOW_REF" ]; then
            echo "ERROR: could not parse a ref out of '${JOB_WORKFLOW_REF}'." >&2
            exit 1
          fi
          echo "engine ref: ${ENGINE_REF} (from ${JOB_WORKFLOW_REF})"
          echo "ref=${ENGINE_REF}" >> "$GITHUB_OUTPUT"

      - name: Check out the engine repo (scripts + templates)
        uses: actions/checkout@v4
        with:
          repository: QuantEcon/contractor-payments
          ref: ${{ steps.engine_ref.outputs.ref }}
          path: engine

      - name: Report which engine commit is running
        run: |
          # Traceability: every run states the exact scripts it used, so a
          # surprising outcome can be tied to a commit without guesswork.
          echo "engine scripts at $(git -C engine rev-parse HEAD)"
          echo "  (ref ${{ steps.engine_ref.outputs.ref }})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Typst (submit mode only)
        if: inputs.mode == 'submit'
        run: |
          TYPST_VERSION="0.13.0"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C /tmp
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Configure git identity (submit mode only)
        if: inputs.mode == 'submit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write issue body to file
        env:
          ISSUE_BODY: ${{ inputs.issue_body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.md

      - name: Parse the issue
        id: parse
        env:
          PYTHONPATH: engine
        run: |
          PARSE_RC=0
          python -m scripts.parse_issue \
            --body-file /tmp/issue_body.md \
            --output-json /tmp/submission.json \
            --output-errors-json /tmp/errors.json \
            --reimbursements config/reimbursements.yml \
            || PARSE_RC=$?
          if [ -f /tmp/submission.json ]; then
            echo "parse_ok=true" >> "$GITHUB_OUTPUT"
            TYPE=$(python -c "import json; print(json.load(open('/tmp/submission.json')).get('type', ''))")
            echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          elif [ -f /tmp/errors.json ]; then
            # The parser ran and rejected the body: a data error the
            # contractor can fix. Stay green so the error-comment steps run.
            echo "parse_ok=false" >> "$GITHUB_OUTPUT"
            echo "type=" >> "$GITHUB_OUTPUT"
          else
            # Neither artifact exists, so the parser never got far enough to
            # judge the body — bad flags, an import error, a missing config.
            # That is an engine fault, and it used to be reported to the
            # contractor as "your submission needs a fix" while the
            # error-comment step itself crashed on the absent errors.json.
            # Fail instead, so the pipeline-failure comment explains it is not
            # their text.
            echo "ERROR: scripts.parse_issue exited ${PARSE_RC} without writing" >&2
            echo "/tmp/submission.json or /tmp/errors.json. Treating this as an" >&2
            echo "engine failure, not a submission error." >&2
            exit 1
          fi

      # ─── /validate path ───────────────────────────────────────────────────
      # Dry-run parser pass; post a sentinel-marked result comment, no PR.

      - name: Post validate-success comment
        id: validate_success
        if: inputs.mode == 'validate' && steps.parse.outputs.parse_ok == 'true' && steps.parse.outputs.type != 'reimbursement'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
        run: |
          CONTRACT_ID=$(python -c "import json; print(json.load(open('/tmp/submission.json'))['contract_id'])")
          python -m scripts.post_validate_result success \
            --submission-file /tmp/submission.json \
            --contract-file "contracts/${CONTRACT_ID}.yml" \
            --submitter "$ISSUE_AUTHOR" \
            --issue "${{ inputs.issue_number }}"

      - name: Post validate-success comment (reimbursement)
        id: validate_success_reimbursement
        if: inputs.mode == 'validate' && steps.parse.outputs.parse_ok == 'true' && steps.parse.outputs.type == 'reimbursement'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
        run: |
          python -m scripts.post_validate_result success \
            --submission-file /tmp/submission.json \
            --reimbursements-file config/reimbursements.yml \
            --submitter "$ISSUE_AUTHOR" \
            --issue "${{ inputs.issue_number }}"

      - name: Post validate-error comment
        id: validate_error
        if: inputs.mode == 'validate' && steps.parse.outputs.parse_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
        run: |
          python -m scripts.post_validate_result error \
            --errors-file /tmp/errors.json \
            --issue "${{ inputs.issue_number }}"

      # ─── /submit path ─────────────────────────────────────────────────────
      # Phase 2.5: revision intent comes from filesystem state — not the
      # event action. If any approved submission exists for this issue,
      # the run is a revision regardless of whether the trigger was a
      # comment, a label, or a reopen.

      - name: Detect revision target
        id: revision
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true'
        env:
          PYTHONPATH: engine
        run: |
          SUPERSEDES=$(python -m scripts.find_previous_submission \
            --issue "${{ inputs.issue_number }}")
          echo "supersedes=$SUPERSEDES" >> "$GITHUB_OUTPUT"
          if [ -n "$SUPERSEDES" ]; then
            echo "Previous approved submission detected; this is a revision superseding: $SUPERSEDES"
          else
            echo "No previously approved submission for this issue; treating as fresh submission."
          fi

      - name: Fetch receipt attachments (reimbursement only)
        id: fetch_receipts
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true' && steps.parse.outputs.type == 'reimbursement'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
        run: |
          # Token-authenticated download of the issue attachments (no
          # official API exists). On failure, fetch_receipts writes
          # parse_issue-shaped errors to /tmp/errors.json so the standard
          # submit-error comment below reports it; the PR is not created.
          if python -m scripts.fetch_receipts \
            --submission-file /tmp/submission.json \
            --staging-dir /tmp/receipts \
            --output-manifest /tmp/receipts_manifest.json \
            --output-errors-json /tmp/errors.json; then
            echo "fetch_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create submission PR
        id: create_pr
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true' && steps.fetch_receipts.outputs.fetch_ok != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
          # Contractor-authored strings reach the shell via env only — an
          # issue title of `"; curl …` must be an odd PR title, not a command.
          # (`issue_body` already used this pattern; title/author/supersedes
          # were the stragglers.)
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          SUPERSEDES: ${{ steps.revision.outputs.supersedes }}
        run: |
          # Array, not a bare $SUPERSEDES_ARG string: keeps the flag absent
          # when there is nothing to supersede without re-splitting the value.
          SUPERSEDES_ARGS=()
          if [ -n "$SUPERSEDES" ]; then
            SUPERSEDES_ARGS=(--supersedes "$SUPERSEDES")
          fi
          python -m scripts.create_submission_pr \
            --submission-file /tmp/submission.json \
            --errors-file /tmp/errors.json \
            --issue-number "${{ inputs.issue_number }}" \
            --issue-author "$ISSUE_AUTHOR" \
            --issue-title "$ISSUE_TITLE" \
            --templates-dir engine/templates \
            --receipts-manifest /tmp/receipts_manifest.json \
            --receipts-staging-dir /tmp/receipts \
            "${SUPERSEDES_ARGS[@]}"

      - name: Clear prior submit-error comment
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true' && steps.fetch_receipts.outputs.fetch_ok != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
        run: |
          python -m scripts.post_error_comment clear \
            --issue "${{ inputs.issue_number }}"

      - name: Clear prior validate-result comment
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true' && steps.fetch_receipts.outputs.fetch_ok != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
        run: |
          python -m scripts.post_validate_result clear \
            --issue "${{ inputs.issue_number }}"

      - name: Close and lock the issue
        id: close_issue
        if: inputs.mode == 'submit' && steps.parse.outputs.parse_ok == 'true' && steps.fetch_receipts.outputs.fetch_ok != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look up the PR that create_submission_pr just opened (or updated)
          # for this issue. Branch name is deterministic per
          # branch_name_for_issue() in create_submission_pr.py.
          BRANCH="submission/issue-${{ inputs.issue_number }}"
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            COMMENT="Submission filed — see #${PR_NUMBER}. This issue is closed and locked now; corrections go via the PR branch (or reopen + /submit to file a revision)."
          else
            COMMENT="Submission filed — see the PR linked above. This issue is closed and locked now; corrections go via the PR branch (or reopen + /submit to file a revision)."
          fi
          gh issue close "${{ inputs.issue_number }}" \
            --comment "$COMMENT" \
            || echo "Issue close failed (may already be closed); continuing."
          gh issue lock "${{ inputs.issue_number }}" --reason resolved \
            || echo "Issue lock failed (may already be locked); continuing."

      # Data errors the contractor can fix themselves: the parser rejected the
      # body, or a receipt attachment could not be fetched. Both are captured
      # as outputs rather than step failures, so this step's implicit
      # `success()` still holds and the comment posts.
      - name: Post submit-error comment (on parse or receipt-fetch failure)
        id: error_comment
        if: inputs.mode == 'submit' && (steps.parse.outputs.parse_ok == 'false' || steps.fetch_receipts.outputs.fetch_ok == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
        run: |
          python -m scripts.post_error_comment post \
            --errors-file /tmp/errors.json \
            --issue "${{ inputs.issue_number }}"

      # ─── Genuinely always (submit mode) ───────────────────────────────────
      # `always()` — not `success()`, not `!cancelled()`. Removing the label is
      # the only way to retry: the caller fires on `labeled`, so re-applying a
      # label that is still applied is a no-op. Leaving it behind on a failed
      # (or cancelled) run would strand the contractor. Nothing downstream
      # depends on this step, so running it after a failure is free — and it
      # runs BEFORE the failure comment below, which tells the contractor the
      # label has been removed.
      - name: Remove `submit` label
        if: ${{ always() && inputs.mode == 'submit' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ inputs.issue_number }}" --remove-label submit \
            || echo "submit label not present; continuing."

      # ─── Failure path ─────────────────────────────────────────────────────
      # Everything above carries an implicit `success()`, so a failure that is
      # NOT a data error — Typst render crash, `gh` API error, PR creation
      # refused, a missing config file — used to skip the error comment too:
      # /submit went completely silent right after /validate had said "ready
      # to submit". This step is the loud fallback. It reports what did and
      # did not happen; it never claims the submission was filed.
      #
      # `failure()`, not `always()`: only when a step above actually failed
      # (a cancelled run is an admin action, not a pipeline fault).
      - name: Post pipeline-failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          O_PARSE: ${{ steps.parse.outcome }}
          O_VALIDATE: ${{ steps.validate_success.outcome }}
          O_VALIDATE_REIMB: ${{ steps.validate_success_reimbursement.outcome }}
          O_VALIDATE_ERROR: ${{ steps.validate_error.outcome }}
          O_REVISION: ${{ steps.revision.outcome }}
          O_FETCH: ${{ steps.fetch_receipts.outcome }}
          O_CREATE_PR: ${{ steps.create_pr.outcome }}
          O_CLOSE: ${{ steps.close_issue.outcome }}
          O_ERROR_COMMENT: ${{ steps.error_comment.outcome }}
        run: |
          # If create_submission_pr already posted a specific comment (a claim
          # too long to render, say) it leaves this marker behind. Staying quiet
          # matters: the generic text below asserts the submission text is fine,
          # which would flatly contradict the specific comment sitting above it.
          if [ -f /tmp/contractor_notified ]; then
            echo "Contractor already has a specific comment on #${ISSUE_NUMBER}; not adding a generic one."
            exit 0
          fi

          # First failing stage wins; anything before `parse` (checkout,
          # Python, Typst install) leaves every outcome empty/skipped, hence
          # the setup fallback.
          STAGE="workflow setup (checkout / Python / Typst install)"
          for CANDIDATE in \
            "$O_PARSE|parsing the submission" \
            "$O_VALIDATE|posting the /validate result" \
            "$O_VALIDATE_REIMB|posting the /validate result" \
            "$O_VALIDATE_ERROR|posting the /validate errors" \
            "$O_REVISION|detecting the revision target" \
            "$O_FETCH|fetching the receipt attachments" \
            "$O_CREATE_PR|rendering the PDF and opening the submission PR" \
            "$O_CLOSE|closing and locking this issue" \
            "$O_ERROR_COMMENT|posting the submission-error comment"; do
            if [ "${CANDIDATE%%|*}" = "failure" ]; then
              STAGE="${CANDIDATE#*|}"
              break
            fi
          done

          if [ "$MODE" = "validate" ]; then
            HEADLINE='`/validate` failed before it could report a result.'
            OUTCOME='Nothing was changed. Re-run `/validate` once the cause below is fixed.'
          elif [ "$O_CREATE_PR" = "success" ]; then
            # PR exists — the contractor must NOT re-submit, or we get a
            # second branch for the same issue.
            HEADLINE='`/submit` failed **after** the submission PR was created.'
            OUTCOME='The PR exists and carries your submission, but the follow-up housekeeping (clearing old comments, closing/locking this issue) did not finish. **Do not re-submit** — an admin will pick this up from the run log.'
          else
            HEADLINE='`/submit` failed — **nothing was filed.**'
            OUTCOME='No submission PR was created. The `submit` label has been removed, so re-applying it retries the run once the cause below is fixed.'
          fi

          {
            printf '> [!WARNING]\n'
            printf '> %s\n\n' "$HEADLINE"
            printf 'This is not a problem with the text of your submission (a bad submission comes back as a "needs a fix" comment listing the lines). The run broke at this stage: **%s**.\n\n' "$STAGE"
            printf '%s\n\n' "$OUTCOME"
            printf 'Run log (admins): %s\n' "$RUN_URL"
          } > /tmp/pipeline_failure.md

          # Tolerated: the job is already red, and a locked issue must not
          # turn a reportable failure into an unreportable one.
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/pipeline_failure.md \
            || echo "WARN: could not post the failure comment on issue #${ISSUE_NUMBER} (locked?)."
