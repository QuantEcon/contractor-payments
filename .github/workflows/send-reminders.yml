name: Send period-close reminders (reusable)

# Reusable workflow that scans a contractor repo for open draft
# submissions whose period has ended, and posts a sentinel-marked
# reminder comment on each. Idempotent across re-runs.
#
# Called from every contractor repo's thin
# `.github/workflows/period-reminders.yml` on a monthly schedule.
#
# See PLAN.md §8 Phase 3c (Period-close reminders).

on:
  workflow_call:
    inputs:
      dry_run:
        description: "If true, log what would be posted; don't post anything."
        required: false
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the contractor repo
        uses: actions/checkout@v4

      # Run this workflow's own engine commit — see the note in
      # process-submission.yml.
      - name: Resolve the engine ref (this workflow's own commit)
        id: engine_ref
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: |
          if [ -z "$JOB_WORKFLOW_REF" ]; then
            echo "ERROR: github.job_workflow_ref is empty; cannot resolve the" >&2
            echo "engine ref." >&2
            exit 1
          fi
          ENGINE_REF="${JOB_WORKFLOW_REF#*.yml@}"
          if [ -z "$ENGINE_REF" ] || [ "$ENGINE_REF" = "$JOB_WORKFLOW_REF" ]; then
            echo "ERROR: could not parse a ref out of '${JOB_WORKFLOW_REF}'." >&2
            exit 1
          fi
          echo "engine ref: ${ENGINE_REF}"
          echo "ref=${ENGINE_REF}" >> "$GITHUB_OUTPUT"

      - name: Check out the engine repo
        uses: actions/checkout@v4
        with:
          repository: QuantEcon/contractor-payments
          ref: ${{ steps.engine_ref.outputs.ref }}
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Send reminders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: engine
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python -m scripts.send_reminders \
            --fiscal-host engine/templates/fiscal-host.yml \
            $DRY_RUN_ARG
