# Declared rather than inherited. Without this table pip falls back to
# `setuptools.build_meta:__legacy__` with `setuptools>=40.8.0`, which does work
# — but PEP 660 editable installs need setuptools>=64, so `pip install -e .`
# on an old enough environment would fail on a floor this repo never stated.
# Naming the backend and the floor makes the build the project's decision.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantecon-timesheets"
version = "0.0.1"
description = "Engine for the QuantEcon contractor timesheets system. See PLAN.md."
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

# The engine runs from a checkout (`python -m scripts.x`) and never installs
# itself, so this repo has several top-level directories that are not packages
# (docs/, templates/, notes/, contractors/, ...). Naming the two that are keeps
# setuptools' auto-discovery from erroring out on the ambiguity, which is what
# makes `pip install -e ".[dev]"` work for CI and for contributors — so the
# dependency list above stays the single source of truth.
[tool.setuptools]
packages = ["scripts", "onboarding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
